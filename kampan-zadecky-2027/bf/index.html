async function get(f){const r=await fetch(f);const b=await r.blob();return new File([b],f,{type:'image/jpeg'})}
async function share(files){try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files})}else{alert('Podrž prst na obrázku a zvol Přidat do Fotek.')}}catch(e){}}
document.querySelectorAll('button[data-f]').forEach(b=>b.onclick=async()=>share([await get(b.dataset.f)]));
document.getElementById('all').onclick=async()=>share(await Promise.all([...document.querySelectorAll('button[data-f]')].map(b=>get(b.dataset.f))));
</script>
